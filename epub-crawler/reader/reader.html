<!doctype html>
<!-- INTENT: 본문과 조작부를 분리해 출판사 서식을 보존하고, 로컬 파일만으로 읽기 설정과 이동을 제공한다. -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>@@TITLE@@</title>
  <style>@@UI_CSS@@</style>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-type" viewBox="0 0 24 24"><path d="m7 17 5-13 5 13M9 12h6M4 21h16"/></symbol>
    <symbol id="i-toc" viewBox="0 0 24 24"><path d="M3 6h14M3 12h14M3 18h14m4-12h.01M21 12h.01M21 18h.01"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m5 5 14 14M5 19 19 5"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M3 4h18M3 9h11M3 14h18M3 19h11"/></symbol>
    <symbol id="i-justify" viewBox="0 0 24 24"><path d="M3 4h18M3 9h18M3 14h18M3 19h18"/></symbol>
    <symbol id="i-single" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="1"/><path d="M9 7h6M9 11h6M9 15h6"/></symbol>
    <symbol id="i-double" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="1"/><path d="M12 3v18M5 7h4M5 11h4M5 15h4m6-8h4m-4 4h4m-4 4h4"/></symbol>
    <symbol id="i-auto" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="1"/><path d="m8 17 4-10 4 10M10 13h4"/></symbol>
    <symbol id="i-less-lines" viewBox="0 0 24 24"><path d="M12 5h10M12 12h10M12 19h10M5 2v7m-3-3 3 3 3-3M5 22v-7m-3 3 3-3 3 3"/></symbol>
    <symbol id="i-more-lines" viewBox="0 0 24 24"><path d="M12 5h10M12 12h10M12 19h10M5 9V2M2 5l3-3 3 3M5 15v7m-3-3 3 3 3-3"/></symbol>
  </defs></svg>

  <header class="toolbar">
    <button id="fullscreen" class="icon-button" aria-label="전체 화면" title="전체 화면"><svg><use href="#i-full"/></svg></button>
    <span class="book-title">@@TITLE@@</span>
    <nav aria-label="읽기 도구">
      <button id="search-toggle" class="icon-button" aria-label="본문 검색" aria-controls="search-panel" aria-expanded="false" title="본문 검색"><svg><use href="#i-search"/></svg></button>
      <button id="settings-toggle" class="icon-button" aria-label="표시 옵션" aria-controls="settings-panel" aria-expanded="false" title="표시 옵션"><svg><use href="#i-type"/></svg></button>
      <button id="toc-toggle" class="icon-button" aria-label="목차와 북마크" aria-controls="toc-panel" aria-expanded="false" title="목차와 북마크"><svg><use href="#i-toc"/></svg></button>
      <button id="bookmark-toggle" class="icon-button" aria-label="현재 위치 북마크" aria-pressed="false" title="현재 위치 북마크"><svg><use href="#i-bookmark"/></svg></button>
    </nav>
  </header>

  <main class="reading-area" aria-label="책 읽기">
    <div id="paper" class="paper"><iframe id="book-frame" title="책 본문" tabindex="0"></iframe><span class="gutter" aria-hidden="true"></span></div>
    <div id="loading" role="status">책을 여는 중입니다…</div>
  </main>

  <section id="settings-panel" class="panel settings-panel" aria-label="표시 옵션" hidden>
    <header class="panel-header"><h2>표시 옵션</h2><button class="icon-button close-panel" aria-label="표시 옵션 닫기"><svg><use href="#i-close"/></svg></button></header>
    <div class="settings-body">
      <div class="theme-row"><label for="dark-theme">어두운 테마</label><button id="dark-theme" class="switch" role="switch" aria-checked="false" aria-label="어두운 테마"><span></span></button></div>
      <div class="setting"><label for="font-family">글꼴</label><select id="font-family"><option value="original">원본</option><option value="sans">고딕</option><option value="serif">명조</option><option value="system">시스템 글꼴</option></select></div>
      <div class="setting"><h3>글꼴 크기</h3><div class="stepper"><button id="font-less" class="option-button" aria-label="글꼴 크기 줄이기"><span class="small-t">T</span></button><output id="font-value">100%</output><button id="font-more" class="option-button" aria-label="글꼴 크기 늘리기"><span class="large-t">T</span></button></div></div>
      <div class="setting"><h3>행 간격</h3><div class="stepper"><button id="line-less" class="option-button" aria-label="행 간격 줄이기"><svg><use href="#i-less-lines"/></svg></button><output id="line-value">100%</output><button id="line-more" class="option-button" aria-label="행 간격 늘리기"><svg><use href="#i-more-lines"/></svg></button></div></div>
      <div class="setting"><h3>양쪽 맞춤</h3><div class="button-group" aria-label="본문 정렬"><button class="option-button" data-align="left" aria-label="왼쪽 정렬" aria-pressed="true"><svg><use href="#i-left"/></svg></button><button class="option-button" data-align="justify" aria-label="양쪽 정렬" aria-pressed="false"><svg><use href="#i-justify"/></svg></button></div></div>
      <div class="setting"><h3>페이지 레이아웃</h3><div class="button-group layouts" aria-label="페이지 레이아웃"><button class="option-button" data-layout="auto" aria-label="자동 레이아웃" aria-pressed="true"><svg><use href="#i-auto"/></svg></button><button class="option-button" data-layout="double" aria-label="두 페이지" aria-pressed="false"><svg><use href="#i-double"/></svg></button><button class="option-button" data-layout="single" aria-label="한 페이지" aria-pressed="false"><svg><use href="#i-single"/></svg></button></div></div>
    </div>
  </section>

  <section id="toc-panel" class="panel toc-panel" aria-label="목차와 북마크" hidden>
    <header class="panel-header tab-header"><div role="tablist" aria-label="책 탐색"><button id="toc-tab" role="tab" aria-selected="true" aria-controls="toc-list">목차</button><button id="bookmarks-tab" role="tab" aria-selected="false" aria-controls="bookmarks-list" tabindex="-1">북마크</button></div><button class="icon-button close-panel" aria-label="목차 닫기"><svg><use href="#i-close"/></svg></button></header>
    <div id="toc-list" class="entry-list" role="tabpanel" aria-labelledby="toc-tab"></div>
    <div id="bookmarks-list" class="entry-list" role="tabpanel" aria-labelledby="bookmarks-tab" hidden></div>
  </section>

  <section id="search-panel" class="panel search-panel" aria-label="본문 검색" hidden>
    <header class="panel-header"><h2>본문 검색</h2><button class="icon-button close-panel" aria-label="검색 닫기"><svg><use href="#i-close"/></svg></button></header>
    <form id="search-form"><input id="search-input" type="search" placeholder="검색어를 입력하세요" aria-label="검색어" autocomplete="off"><button type="submit">검색</button></form>
    <p id="search-status" class="search-status" role="status">책 전체에서 검색합니다.</p><div id="search-results" class="entry-list"></div>
  </section>

  <footer class="progress-bar" aria-label="읽기 위치">
    <div class="slider-wrap"><output id="page-tooltip" class="page-tooltip" for="page-slider"></output><input id="page-slider" type="range" min="1" max="1" value="1" aria-label="원본 페이지 이동"></div>
    <button id="previous" class="icon-button" aria-label="이전 화면" title="이전 화면 (←)"><svg><use href="#i-prev"/></svg></button>
    <form id="page-form"><input id="page-number" type="number" min="1" value="1" aria-label="페이지 번호" title="원본 페이지 번호 입력"><span id="page-end" hidden></span><span id="page-total">/ 1</span></form>
    <button id="next" class="icon-button" aria-label="다음 화면" title="다음 화면 (→)"><svg><use href="#i-next"/></svg></button>
  </footer>
  <div id="notice" class="notice" role="status" hidden></div>
  <noscript>이 읽기 화면에는 JavaScript가 필요합니다. text 폴더의 XHTML 파일도 직접 열어 읽을 수 있습니다.</noscript>
  <script id="book-data" type="application/json">@@BOOK@@</script>
  <script id="content-style" type="application/json">@@CONTENT_CSS@@</script>
  <script>@@SCRIPT@@</script>
</body>
</html>
